# Self-hosted fleet runner. $0 / no Mend. GITHUB_TOKEN is not a valid
# Renovate auth token (checkout may still use it).
#
# Auth today: PAT secret RENOVATE_TOKEN (classic, repo + workflow).
# App-token step stays for when APP_CLIENT_ID + APP_PRIVATE_KEY exist.
# repositories is omitted so an org-wide App install can mint a
# fleet-scoped token later; do not block on creating that App.
#
# Daily scans service security alerts; ordinary updates use the shared Monday
# window. Manual runs can bypass time, but never caps, release age, or review.
name: Renovate

on:
  schedule:
    # 05:17 CDT / 04:17 CST. The all-day Monday window tolerates runner delays.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry run (no update PRs)
        type: boolean
        default: true
      unrestricted:
        description: Run now outside Monday (preserves two-PR cap, release age, and review).
        type: boolean
        default: false
      repository:
        description: Optional MooseGooseConsulting/repository; blank discovers the organization.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: renovate-fleet
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Require owner auth secrets
        id: auth
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ -n "$RENOVATE_TOKEN" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing Renovate auth. Add RENOVATE_TOKEN (classic PAT, repo + workflow scopes) or APP_CLIENT_ID + APP_PRIVATE_KEY for an org-installed GitHub App (Contents/Issues/PRs/Workflows write; Checks/Commit statuses/Dependabot alerts read). Do not use GITHUB_TOKEN as the Renovate auth token. No Mend."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Create GitHub App token
        if: steps.auth.outputs.mode == 'app'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # v3 accepts client-id (preferred) or legacy app-id. Secret is the App Client ID.
          # owner without repositories = all repos in the owner's App installation.
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Map dry-run input
        if: inputs.dryRun
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      - name: Self-hosted Renovate (fleet)
        uses: renovatebot/github-action@v46.3.3
        with:
          configurationFile: .github/renovate-diagnostic.cjs
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN }}
          # Wrapper v46.3.3; pin Renovate 44.107.0 (documented github-action pin)
          # so the runner image stays reproducible.
          renovate-version: 44.107.0
        env:
          LOG_LEVEL: info
          RENOVATE_TARGET_REPOSITORY: ${{ inputs.repository }}
          RENOVATE_DIAGNOSTIC_FORCE: ${{ inputs.unrestricted || false }}
          RENOVATE_PRESET_REF: ${{ inputs.dryRun && github.ref_name != github.event.repository.default_branch && github.ref_name || '' }}
