# Self-hosted fleet runner. $0 / no Mend. GITHUB_TOKEN is not a valid
# Renovate auth token (checkout may still use it).
#
# Auth today: PAT secret RENOVATE_TOKEN (classic, repo + workflow).
# Prefer the existing cross-owner PAT. The optional App-token path can only
# serve a manually targeted organization repo, not both owners' full fleet.
#
# Daily scans service security alerts; ordinary updates use the shared Monday
# window. Manual runs can bypass time, but never caps, release age, or review.
name: Renovate

on:
  schedule:
    # 05:17 CDT / 04:17 CST. The all-day Monday window tolerates runner delays.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry run (no update PRs)
        type: boolean
        default: true
      unrestricted:
        description: Run now outside Monday (preserves two-PR cap, release age, and review).
        type: boolean
        default: false
      repository:
        description: Optional MooseGooseConsulting/repository or Coldaine/repository; blank discovers both owners.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: renovate-fleet
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Require owner auth secrets
        id: auth
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: |
          if [ -n "$RENOVATE_TOKEN" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          elif [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            if [[ "${TARGET_REPOSITORY,,}" == moosegooseconsulting/* ]]; then
              echo "mode=app" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Full-fleet and Coldaine runs require RENOVATE_TOKEN with access to both owners. An organization App installation token cannot cover the personal account."
              exit 1
            fi
          else
            echo "::error::Missing Renovate auth. Full-fleet runs require RENOVATE_TOKEN (classic PAT, repo + workflow scopes) with access to both owners. An organization App is supported only for manually targeted organization runs. Do not use GITHUB_TOKEN as the Renovate auth token. No Mend."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Create GitHub App token
        if: steps.auth.outputs.mode == 'app'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # v3 accepts client-id (preferred) or legacy app-id. Secret is the App Client ID.
          # owner without repositories = all repos in the owner's App installation.
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Map dry-run input
        if: inputs.dryRun
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      - name: Self-hosted Renovate (fleet)
        uses: renovatebot/github-action@v46.3.3
        with:
          configurationFile: .github/renovate-diagnostic.cjs
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN }}
          # Wrapper v46.3.3; pin Renovate 44.107.0 (documented github-action pin)
          # so the runner image stays reproducible.
          renovate-version: 44.107.0
        env:
          LOG_LEVEL: info
          RENOVATE_TARGET_REPOSITORY: ${{ inputs.repository }}
          RENOVATE_DIAGNOSTIC_FORCE: ${{ inputs.unrestricted || false }}
          RENOVATE_PRESET_REF: ${{ inputs.dryRun && github.ref_name != github.event.repository.default_branch && github.ref_name || '' }}

      # The release-age soak holds updates without opening anything, and the Dependency Dashboard
      # is off, so this summary is where held updates show up. This repository is public: it names
      # only repositories GitHub serves publicly and aggregates the rest. It must not fail the run.
      - name: Summarize updates held by the release-age soak
        if: always()
        continue-on-error: true
        env:
          # The runner's PAT reads both owners' repositories, so it can tell public from private.
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN || github.token }}
        run: |
          report=/tmp/renovate-report.json
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          summary "## Release-age soak"
          if [ ! -s "$report" ]; then summary "Renovate wrote no report."; exit 0; fi
          if ! rows=$(jq -r -f .github/renovate-held.jq "$report"); then
            summary "The Renovate report could not be read."; exit 0
          fi
          if [ -z "$rows" ]; then
            summary "No updates are held by the release-age soak and no lookups warned."; exit 0
          fi
          table=""; private_repos=0; unknown_repos=0; undated_total=0
          p_undated=0; p_aging=0; p_partial=0; p_warnings=0
          u_undated=0; u_aging=0; u_partial=0; u_warnings=0
          while IFS=$'\t' read -r repo undated aging partial warnings; do
            undated_total=$((undated_total + undated))
            visibility=$(gh api "repos/$repo" --jq .private 2>/dev/null || true)
            if [ "$visibility" = "false" ]; then
              table+="| $repo | $undated | $aging | $partial | $warnings |"$'\n'
            elif [ "$visibility" = "true" ]; then
              private_repos=$((private_repos + 1))
              p_undated=$((p_undated + undated)); p_aging=$((p_aging + aging))
              p_partial=$((p_partial + partial)); p_warnings=$((p_warnings + warnings))
            else
              # Not named: the lookup failed, so the repository may be private.
              unknown_repos=$((unknown_repos + 1))
              u_undated=$((u_undated + undated)); u_aging=$((u_aging + aging))
              u_partial=$((u_partial + partial)); u_warnings=$((u_warnings + warnings))
            fi
          done <<< "$rows"
          summary "| Repository | Held, no release date | Held, aging | Newer releases withheld | Lookup warnings |"
          summary "| --- | ---: | ---: | ---: | ---: |"
          [ -n "$table" ] && printf '%s' "$table" >> "$GITHUB_STEP_SUMMARY"
          if [ "$private_repos" -gt 0 ]; then
            summary "| Private repositories ($private_repos) | $p_undated | $p_aging | $p_partial | $p_warnings |"
          fi
          if [ "$unknown_repos" -gt 0 ]; then
            summary "| Visibility unknown ($unknown_repos) | $u_undated | $u_aging | $u_partial | $u_warnings |"
            echo "::warning title=Release-age soak::$unknown_repos repository visibility lookup(s) failed; those rows are aggregated."
          fi
          if [ "$undated_total" -gt 0 ]; then
            echo "::warning title=Release-age soak::$undated_total update(s) held with no release date; see the job summary."
          fi
