# Self-hosted fleet runner. $0 / no Mend. GITHUB_TOKEN is not a valid
# Renovate auth token (checkout may still use it).
#
# Auth today: PAT secret RENOVATE_TOKEN (classic, repo + workflow).
# App-token step stays for when APP_CLIENT_ID + APP_PRIVATE_KEY exist.
# repositories is omitted so an org-wide App install can mint a
# fleet-scoped token later; do not block on creating that App.
#
# Weekday cron inherits default.json throttles. workflow_dispatch
# defaults to dry-run. Unrestricted diagnostic force is opt-in and
# wet-only (see renovate-diagnostic.cjs).
name: Renovate diagnostic

on:
  schedule:
    # 05:00 America/Chicago CDT (UTC-5). Shared preset owns PR pacing.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry run (no update PRs)
        type: boolean
        default: true
      unrestricted:
        description: Wet-run only. Force unrestricted schedule and PR throttles (diagnostic). Leave off so cron and normal dispatch inherit default.json.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Require owner auth secrets
        id: auth
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ -n "$RENOVATE_TOKEN" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing Renovate auth. Add RENOVATE_TOKEN (classic PAT, repo + workflow scopes) or APP_CLIENT_ID + APP_PRIVATE_KEY for an org-installed GitHub App (Contents/Issues/PRs/Workflows write; Checks/Commit statuses/Dependabot alerts read). Do not use GITHUB_TOKEN as the Renovate auth token. No Mend."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Create GitHub App token
        if: steps.auth.outputs.mode == 'app'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # v3 accepts client-id (preferred) or legacy app-id. Secret is the App Client ID.
          # owner without repositories = all repos in the owner's App installation.
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Map dry-run input
        if: inputs.dryRun
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      - name: Map diagnostic force (wet + unrestricted only)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dryRun && inputs.unrestricted }}
        run: echo "RENOVATE_DIAGNOSTIC_FORCE=true" >> "$GITHUB_ENV"

      - name: Self-hosted Renovate (fleet)
        uses: renovatebot/github-action@v46.2.2
        with:
          configurationFile: .github/renovate-diagnostic.cjs
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN }}
          # Wrapper v46.2.2; pin Renovate 44.29.4 (documented github-action pin)
          # so the runner image stays reproducible.
          renovate-version: 44.29.4
        env:
          LOG_LEVEL: info
