# Diagnostic only. Does not run until the owner adds GitHub App secrets
# (APP_CLIENT_ID + APP_PRIVATE_KEY) or RENOVATE_TOKEN. GITHUB_TOKEN is not
# supported. $0 / no Mend.
name: Renovate diagnostic

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry run (no update PRs)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Require owner auth secrets
        id: auth
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [ -n "$RENOVATE_TOKEN" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Owner click required. Create an org GitHub App (Contents/Issues/PRs/Workflows write), install it on renovate-config plus ColdSearch, NorthStarGuardian, RoccatMouse, frozenSkillz, and add APP_CLIENT_ID + APP_PRIVATE_KEY. Or add RENOVATE_TOKEN (classic PAT, repo scope). Do not use GITHUB_TOKEN. No Mend."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Create GitHub App token
        if: steps.auth.outputs.mode == 'app'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            renovate-config
            ColdSearch
            NorthStarGuardian
            RoccatMouse
            frozenSkillz

      - name: Self-hosted Renovate (first wave)
        uses: renovatebot/github-action@v46.2.2
        with:
          configurationFile: .github/renovate-diagnostic.js
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN }}
          renovate-version: 44.29.4
        env:
          RENOVATE_DRY_RUN: ${{ inputs.dryRun }}
          LOG_LEVEL: info
