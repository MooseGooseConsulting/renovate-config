# Self-hosted fleet runner. $0 / no Mend. GITHUB_TOKEN is not a valid
# Renovate auth token (checkout may still use it).
#
# Auth today: PAT secret RENOVATE_TOKEN (classic, repo + workflow + read:packages; read:packages
# lets default.json date GHCR images through the GitHub Packages API).
# Prefer the existing cross-owner PAT. The optional App-token path can only
# serve a manually targeted organization repo, not both owners' full fleet.
#
# Daily runs raise security-fix PRs from GitHub Dependabot alerts, which were on for
# every discovered repository on 2026-10-21; a repository created later gets no
# security-fix PRs until Dependabot alerts are turned on for it. Ordinary updates
# use the shared Monday window. Manual runs can bypass time, but never caps,
# release age, or review.
name: Renovate

on:
  schedule:
    # 05:17 CDT / 04:17 CST. The all-day Monday window tolerates runner delays.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry run (no update PRs)
        type: boolean
        default: true
      unrestricted:
        description: Run now outside Monday (preserves the PR cap, release age, and review).
        type: boolean
        default: false
      repository:
        description: Optional MooseGooseConsulting/repository or Coldaine/repository; blank discovers both owners.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: renovate-fleet
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Require owner auth secrets
        id: auth
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
        run: |
          if [ -n "$RENOVATE_TOKEN" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
          elif [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            if [[ "${TARGET_REPOSITORY,,}" == moosegooseconsulting/* ]]; then
              echo "mode=app" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Full-fleet and Coldaine runs require RENOVATE_TOKEN with access to both owners. An organization App installation token cannot cover the personal account."
              exit 1
            fi
          else
            echo "::error::Missing Renovate auth. Full-fleet runs require RENOVATE_TOKEN (classic PAT, repo, workflow and read:packages scopes) with access to both owners. An organization App is supported only for manually targeted organization runs. Do not use GITHUB_TOKEN as the Renovate auth token. No Mend."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Create GitHub App token
        if: steps.auth.outputs.mode == 'app'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # v3 accepts client-id (preferred) or legacy app-id. Secret is the App Client ID.
          # owner without repositories = all repos in the owner's App installation.
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # default.json dates third-party GHCR images through the GitHub Packages API (custom.ghcr). A
      # token that cannot read packages gets HTTP 403 there (401 with no token), and Renovate records only a "no-result"
      # lookup warning, so every such image would get no update without anything failing. Probe the API
      # with the token Renovate uses and report a failure as an error annotation and in the job
      # summary. The run continues: those images get no update either way (fail closed), and the rest
      # of the fleet still gets its updates.
      - name: Check the token can read GHCR release dates
        continue-on-error: true
        # Bounded so a stalled API connection cannot hold up the Renovate step behind it.
        timeout-minutes: 3
        env:
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN }}
        run: |
          probe() { curl -sS --connect-timeout 10 --max-time 20 --retry 2 --retry-max-time 60 "$@"; }
          # X-OAuth-Scopes lists a classic PAT's scopes, which are not secret; App and fine-grained
          # tokens send none.
          scopes=$(probe -I -H "Authorization: token $RENOVATE_TOKEN" https://api.github.com/rate_limit |
            tr -d '\r' | awk 'tolower($1) == "x-oauth-scopes:" { $1 = ""; sub(/^ /, ""); print }' || true)
          # The probe is the real test: a public package, requested the way the datasource asks.
          status=$(probe -o /dev/null -w '%{http_code}' -H "Authorization: token $RENOVATE_TOKEN" \
            "https://api.github.com/users/renovatebot/packages/container/renovate/versions?per_page=1" || true)
          echo "Auth mode: $AUTH_MODE. Token scopes: ${scopes:-none reported}. GitHub Packages API probe: HTTP ${status:-none}."
          if [ "$status" = "200" ]; then
            echo "GHCR release dates: available (token scopes: ${scopes:-none reported})." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$AUTH_MODE" = "app" ]; then
            # GitHub's Packages REST API accepts only classic personal access tokens.
            why="this run uses the GitHub App installation token, which the GitHub Packages API does not accept (API probe: HTTP ${status:-none})"
            fix="Run with RENOVATE_TOKEN (a classic PAT with read:packages) to date GHCR images."
          elif [ "$status" = "401" ]; then
            why="GitHub rejected the token itself (HTTP 401: missing, invalid or expired)"
            fix="Replace RENOVATE_TOKEN with a valid classic PAT that has read:packages."
          elif [ "$status" = "403" ]; then
            case ",${scopes// /}," in
              *,read:packages,* | *,write:packages,*)
                why="the token has a packages scope, but the GitHub Packages API refused it (HTTP $status)"
                fix="Check that RENOVATE_TOKEN is a classic PAT that is still valid." ;;
              *)
                why="the token lacks read:packages (scopes: ${scopes:-none reported}; API probe: HTTP $status)"
                fix="Add read:packages to the RENOVATE_TOKEN classic PAT." ;;
            esac
          else
            # Not an authorization answer: a timeout, a network failure or a GitHub outage.
            why="the GitHub Packages API probe did not get an authorization answer (HTTP ${status:-none}; 000 means no response)"
            fix="Check the run log and GitHub's status; the token's scopes are ${scopes:-not reported}."
          fi
          echo "::error title=GHCR release dates unavailable::No third-party ghcr.io image can be dated, so none gets an update: $why. $fix"
          {
            echo "## GHCR release dates unavailable"
            echo ""
            echo "Third-party \`ghcr.io\` images are dated through the GitHub Packages API, and $why. $fix Until then no such image gets an update; each repository's Dependency Dashboard lists them as failed lookups."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Map dry-run input
        if: inputs.dryRun
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      - name: Self-hosted Renovate (fleet)
        uses: renovatebot/github-action@v46.3.3
        with:
          configurationFile: .github/renovate-diagnostic.cjs
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN }}
          # Docker Hub's image, so Renovate dates the runner's own updates (it reads no GHCR dates for this
          # image). renovate.json groups this pin with the validator image in validate.yml.
          renovate-image: docker.io/renovate/renovate
          renovate-version: 44.107.0
        env:
          LOG_LEVEL: info
          RENOVATE_TARGET_REPOSITORY: ${{ inputs.repository }}
          RENOVATE_DIAGNOSTIC_FORCE: ${{ inputs.unrestricted || false }}
          RENOVATE_PRESET_REF: ${{ inputs.dryRun && github.ref_name != github.event.repository.default_branch && github.ref_name || '' }}
