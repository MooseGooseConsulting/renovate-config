name: Validate Renovate configuration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run renovate:validate
      - run: npx --yes --package renovate@latest renovate-config-validator --strict .github/renovate-diagnostic.cjs
      # renovate.json dates the runner image on Docker Hub; the action pulls it from GHCR.
      - name: Check the pinned Renovate image exists on GHCR
        run: |
          version=$(sed -nE 's/^[[:space:]]*renovate-version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' .github/workflows/renovate-diagnostic.yml)
          test -n "$version"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:renovatebot/renovate:pull" | jq -r .token)
          curl -fsSI -o /dev/null \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/renovatebot/renovate/manifests/$version"
          echo "ghcr.io/renovatebot/renovate:$version exists"
