name: Validate Renovate configuration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The same Renovate image and release as the runner in renovate-diagnostic.yml. renovate.json
      # groups the two references, so Renovate bumps them in one PR.
      - name: Validate the presets
        uses: docker://docker.io/renovate/renovate:44.255.1@sha256:183a671d000c8f20f9dac8c3b1100677c1edb79a0b46bcf8798f1490c785d27c
        with:
          entrypoint: /usr/local/sbin/renovate-config-validator
          args: --strict --no-global default.json frequent.json org-inherited-config.json renovate.json
      - name: Validate the runner configuration
        uses: docker://docker.io/renovate/renovate:44.255.1@sha256:183a671d000c8f20f9dac8c3b1100677c1edb79a0b46bcf8798f1490c785d27c
        with:
          entrypoint: /usr/local/sbin/renovate-config-validator
          args: --strict .github/renovate-diagnostic.cjs
